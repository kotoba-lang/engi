name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: clojure -M:test (pure engi.core, JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: clojure -M:test
      - run: clojure -M:lint

  test-cljs:
    name: shadow-cljs node-test (engi.crypto / engi.store / engi.protocol — fake client, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules / gitlibs
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.gitlibs
            ~/.m2
          key: ${{ runner.os }}-cljs-${{ hashFiles('package.json', 'deps.edn') }}

      - run: npm install
      - run: npm run test:cljs

  # Deliberately NOT run in CI: `npm run test:live` exercises the FULL
  # propose->validate->counter-commit->finalize handshake against
  # PRODUCTION kotobase.net with throwaway did:key agents. It needs no
  # secrets (did:key agents self-mint), but running a live-network test on
  # every push/PR is undesirable (flaky on transient 5xx, writes real
  # (if throwaway) data every run). Run it manually: `npm run test:live` /
  # `bb test-live`. See README "Live integration test".
